appId: dev.papex.writer
productName: Papex Writer
copyright: Copyright 2026 The Papex Authors
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/latex/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{CHANGELOG.md,README.md,readme.md}"
asar: true
asarUnpack:
  - resources/latex/**/*
win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  icon: resources/icon/icon.ico
  # Windows 10+ baseline is enforced by Electron 33 (Chromium); NSIS/MSI x64 only.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Papex Writer
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon/icon.icns
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icon
publish:
  provider: github
  owner: Maicarons
  repo: papex-writer
